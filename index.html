<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date | Carrefour Media</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Estilos (puedes mover esto a un styles.css si también quieres separar el CSS) -->
  <style>
    /* ... PEGA AQUÍ TODO EL CSS ANTERIOR ... */
  </style>

  <!-- Script separado con defer para que cargue después del HTML -->
  <script src="script.js" defer></script>
</head>
<body>

  <div class="card-container" id="card">
    
    <!-- PANTALLA 1: RECIBIMIENTO / SAVE THE DATE -->
    <div class="step" id="step-1">
      <span class="badge">Save The Date</span>
      <h1 class="title">Retail Media<br>Summit</h1>
      <p class="subtitle">Conectando marcas con audiencias reales.</p>

      <!-- Botón sin onclick -->
      <button type="button" class="btn" id="btn-next">Inscribirme ahora</button>

      <div class="brand-logo">
        <img src="crf_rm.png" alt="Logo Carrefour Media">
      </div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE INSCRIPCIÓN -->
    <div class="step" id="step-2">
      <h2 class="form-title">Reserva tu lugar</h2>
      <p class="form-sub">Completa los datos para confirmar tu asistencia</p>

      <!-- Formulario sin onsubmit -->
      <form id="rsvp-form" style="width: 100%;">
        <div class="form-group">
          <label for="nombre">Nombre y Apellido</label>
          <input type="text" id="nombre" required placeholder="Ej. Ana García">
        </div>
        
        <div class="form-group">
          <label for="empresa">Empresa / Marca</label>
          <input type="text" id="empresa" required placeholder="Ej. Mi Marca Corp">
        </div>

        <div class="form-group">
          <label for="email">Correo Corporativo</label>
          <input type="email" id="email" required placeholder="ana@empresa.com">
        </div>

        <div class="form-group">
          <label for="dni">DNI</label>
          <input type="text" id="dni" required placeholder="Ej. 12345678">
        </div>

        <div class="form-group">
          <label for="dieta">Restricciones Alimenticias</label>
          <select id="dieta" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="ninguna">Ninguna</option>
            <option value="vegetariano">Vegetariano/a</option>
            <option value="vegano">Vegano/a</option>
            <option value="celiaco">Celíaco/a (Sin TACC)</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <button type="submit" class="btn btn-submit" id="btn-submit">Confirmar Registro</button>
      </form>

      <!-- Confirmación tras enviar -->
      <div id="success-message">
        <h3 style="font-size: 1.5rem; margin-bottom: 10px;">¡Registro Exitoso!</h3>
        <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.8);">
          Te enviamos la confirmación e itinerario a tu correo.
        </p>
      </div>

      <!-- Enlace sin onclick -->
      <span class="back-link" id="btn-prev">← Volver a la invitación</span>
    </div>

  </div>
</body>
</html>
